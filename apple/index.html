<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Bypass & Tweaks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* Modern CSS Variables matching the theme */
        :root {
            --bg-deep: #0a1128;
            --bg-card: rgba(27, 38, 59, 0.4);
            --border-glow: rgba(73, 182, 255, 0.15);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            /* Subtle background glow effect */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(79, 172, 254, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.08) 0%, transparent 45%);
        }

        /* Glassmorphism content card */
        .content-section {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 40%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .description {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* Upgraded Clean List/Card Styling */
        .resource-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .resource-item a {
            display: block;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.2rem 1.5rem;
            border-radius: 14px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* Smooth hover pop and highlight effect */
        .resource-item a:hover {
            background: rgba(79, 172, 254, 0.05);
            border-color: var(--accent-blue);
            color: var(--accent-cyan);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.1);
            padding-left: 1.8rem; /* Subtle indent effect on hover */
        }

        /* Back to Home Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            font-size: 0.95rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
            font-weight: 500;
        }

        .back-link:hover {
            color: var(--accent-cyan);
        }

        /* Entry Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="content-section">
        <h1>Apple Bypass & Tweaks</h1>
        <p class="description">Tools and resources for iOS devices:</p>
        
        <ul class="resource-list">
            <li class="resource-item"><a href="#">iCloud Bypass Tools</a></li>
            <li class="resource-item"><a href="#">Jailbreak Resources (Palera1n/Dopamine)</a></li>
            <li class="resource-item"><a href="#">Custom IPA Apps</a></li>
            <li class="resource-item"><a href="#">System Tweaks</a></li>
        </ul>

        <a href="../" class="back-link">← Back to Home</a>
    </div>

</body>
</html>
